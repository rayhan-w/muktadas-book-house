---
deployment:
  tasks:
    - export DEPLOYPATH=/home/muktadar/public_html/
    - if [ ! -d "$DEPLOYPATH" ]; then export DEPLOYPATH=${HOME}/public_html/; fi
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -Rf * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f .env $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f index.php $DEPLOYPATH 2>/dev/null || true
    - /bin/rm -rf $DEPLOYPATH/storage/framework/views/*.php 2>/dev/null || true
    - /bin/rm -rf $DEPLOYPATH/bootstrap/cache/*.php 2>/dev/null || true
    - if [ -f "$DEPLOYPATH/artisan" ]; then /usr/local/bin/php $DEPLOYPATH/artisan migrate --force 2>/dev/null || php $DEPLOYPATH/artisan migrate --force 2>/dev/null || true; fi
    - if [ -f "$DEPLOYPATH/artisan" ]; then /usr/local/bin/php $DEPLOYPATH/artisan optimize:clear 2>/dev/null || php $DEPLOYPATH/artisan optimize:clear 2>/dev/null || true; fi
